<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ShopGuide Launchfilm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#e8f5ee}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#e8f5ee;
  font-family:'Segoe UI',sans-serif;color:#2c3e50}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#layerB{background:#e8f5ee}
.world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.a{position:absolute}
.ln{position:absolute;white-space:nowrap;line-height:1.12}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .1em}
.wi{display:inline-block}
.green{color:#27ae60}
.grey{color:#7f8c8d}
#dot{position:absolute;left:0;top:0;width:100px;height:100px;border-radius:50%;transform-origin:0 0;
  display:flex;align-items:center;justify-content:center}
#dotCore{border-radius:50%;display:flex;align-items:center;justify-content:center}
#dotDigit{color:#fff;font-weight:800;font-size:56px;line-height:1;display:block}
</style>
</head>
<body>
<div id="stage">
  <div id="layerA" class="layer"><div id="worldA" class="world"></div></div>
  <div id="layerB" class="layer"><div id="worldB" class="world"></div></div>
  <div id="dot"><div id="dotCore"><span id="dotDigit">1</span></div></div>
</div>
<svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
<script>
/* =====================================================================
   ShopGuide · 15-second launch film
   Every style is a pure function of t inside window.seek(t).
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const C = { green:'#27ae60', navy:'#2c3e50', field:'#ecf0f1', grey:'#7f8c8d', ground:'#e8f5ee', screen:'#f4f6f7', shelfOn:'#d8e1e6' };

/* ---------- easing ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const U = (t, a, b) => clamp((t - a) / (b - a));
// damped spring step response, settles in ~d seconds, overshoot ~1 %
function spring(t, d = 0.6, z = 0.82) {
  if (t <= 0) return 0;
  const w0 = 6.2 / d, wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
}
const expoOut = u => u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
const expoIn = u => u <= 0 ? 0 : u >= 1 ? 1 : (Math.pow(2, 10 * u) - 1) / 1023;
const bump = (t, a, b) => { const u = U(t, a, b); return Math.sin(Math.PI * u); };
const rgb = c => Array.isArray(c) ? c : [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mixA = (c1, c2, u) => { const a = rgb(c1), b = rgb(c2); return a.map((v, i) => lerp(v, b[i], clamp(u))); };
const mix = (c1, c2, u) => `rgb(${mixA(c1, c2, u).map(Math.round).join(',')})`;

/* ---------- DOM helpers ---------- */
const UNITLESS = new Set(['zIndex', 'fontWeight', 'opacity']);
function div(parent, css, html) {
  const e = document.createElement('div'); e.className = 'a';
  if (css) for (const k in css) e.style[k] = typeof css[k] === 'number' && !UNITLESS.has(k) ? css[k] + 'px' : css[k];
  if (html != null) e.innerHTML = html;
  parent.appendChild(e); return e;
}
function svg(parent, tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
}
// one line of words, each inside its own mask
function line(parent, o, parts) {
  const ln = document.createElement('div'); ln.className = 'ln';
  ln.style.left = (o.x || 0) + 'px'; ln.style.top = o.y + 'px';
  ln.style.fontSize = o.size + 'px'; ln.style.fontWeight = o.weight || 800;
  ln.style.letterSpacing = o.ls == null ? '-0.02em' : o.ls;
  if (o.center) { ln.style.width = '1920px'; ln.style.textAlign = 'center'; }
  if (o.color) ln.style.color = o.color;
  const words = [];
  parts.forEach((p, i) => {
    const m = document.createElement('span'); m.className = 'wm';
    const w = document.createElement('span'); w.className = 'wi' + (p.cls ? ' ' + p.cls : '');
    w.innerHTML = p.t; m.appendChild(w); ln.appendChild(m);
    if (i < parts.length - 1 && !p.tight) ln.appendChild(document.createTextNode(' '));
    words.push({ m, w });
  });
  parent.appendChild(ln);
  return words;
}

/* ---------- motion blur (directional, follows velocity) ---------- */
const fxDefs = $('fx'); let fxCount = 0;
function mblur(el, sx, sy) {
  sx = Math.min(Math.abs(sx), 40); sy = Math.min(Math.abs(sy), 40);
  if (sx < 0.3 && sy < 0.3) { if (el._fOn) { el.style.filter = 'none'; el._fOn = false; } return; }
  if (!el._f) {
    const id = 'mb' + (fxCount++);
    const f = svg(fxDefs, 'filter', { id, x: '-30%', y: '-30%', width: '160%', height: '160%', 'color-interpolation-filters': 'sRGB' });
    el._f = { id, g: svg(f, 'feGaussianBlur', { stdDeviation: '0 0' }) };
  }
  el._f.g.setAttribute('stdDeviation', sx.toFixed(2) + ' ' + sy.toFixed(2));
  el.style.filter = `url(#${el._f.id})`; el._fOn = true;
}
const SHUTTER = 1 / 300;          // blur sigma per px/s
const DT = 1 / 240;               // velocity probe

/* ---------- word reveal: rises out of its mask, exits through it ---------- */
function wordY(t, tin, tout, dir = -1) {
  let y = t < tin ? 1.18 : 1.18 * (1 - spring(t - tin, 0.5));
  if (tout != null && t > tout) y += dir * 1.25 * expoIn(U(t, tout, tout + 0.2));
  return y;
}
function animWord(wd, t, tin, tout, dir, extra = '') {
  const h = wd.h;
  const y = wordY(t, tin, tout, dir), y0 = wordY(t - DT, tin, tout, dir);
  wd.w.style.transform = `translateY(${(y * h).toFixed(2)}px)${extra}`;
  mblur(wd.w, 0, (y - y0) * h / DT * SHUTTER);
}

/* =====================================================================
   WORLD A · hook, phone (scan + route)
   ===================================================================== */
const worldA = $('worldA'), layerA = $('layerA');

// hook
const HOOK = 176;
const hook1 = line(worldA, { y: 286, size: HOOK, center: true }, [{ t: 'Wo' }, { t: 'ist' }, { t: 'bloß' }]);
const hook2 = line(worldA, { y: 486, size: HOOK, center: true }, [{ t: 'die' }, { t: 'Milch', tight: true }, { t: '?' }]);
const hookWords = [...hook1, ...hook2];
const hookIn = [-0.04, 0.03, 0.5, 1.0, 1.07, 1.12];
const hookOut = [1.53, 1.55, 1.57, 1.47, 1.49, 1.51];   // lower line clears first, the phone rises behind it
const qWord = hook2[2];
const qProbe = document.createElement('span');
qProbe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
qWord.w.appendChild(qProbe);

// captions
const CAPX = 330;
const cap1 = [line(worldA, { x: CAPX, y: 330, size: 112 }, [{ t: 'Zettel' }])[0],
              line(worldA, { x: CAPX, y: 452, size: 112 }, [{ t: 'scannen.', cls: 'green' }])[0]];
const cap2 = [line(worldA, { x: CAPX, y: 330, size: 112 }, [{ t: 'Deine' }])[0],
              line(worldA, { x: CAPX, y: 452, size: 112 }, [{ t: 'Route.', cls: 'green' }])[0]];
const sub2 = line(worldA, { x: CAPX + 4, y: 600, size: 40, weight: 600, ls: '0', color: C.grey }, [{ t: 'Kühlware' }, { t: 'zuletzt.' }]);

// phone
const PX = 1070, PY = 83, FX = 14, FY = 14;
const phone = div(worldA, { left: PX, top: PY, width: 440, height: 914 });
div(phone, { left: -4, top: 190, width: 6, height: 58, borderRadius: 3, background: '#2a2a2d' });
div(phone, { left: -4, top: 262, width: 6, height: 58, borderRadius: 3, background: '#2a2a2d' });
div(phone, { left: 438, top: 236, width: 6, height: 96, borderRadius: 3, background: '#2a2a2d' });
div(phone, { left: 0, top: 0, width: 440, height: 914, borderRadius: 74,
  background: 'linear-gradient(160deg,#1c1c1e 0%,#2c2c2e 60%,#1a1a1c 100%)',
  boxShadow: 'inset 0 0 0 1.5px rgba(255,255,255,.10), 0 40px 90px rgba(44,62,80,.26), 0 12px 28px rgba(44,62,80,.14)' });
const face = div(phone, { left: FX, top: FY, width: 412, height: 886, borderRadius: 60, overflow: 'hidden', background: C.screen });
div(face, { left: 0, top: 0, width: 412, height: 126, background: C.navy });
div(face, { left: 146, top: 12, width: 120, height: 34, borderRadius: 17, background: '#000' });
div(face, { left: 42, top: 14, color: '#fff', fontSize: 19, fontWeight: 600 }, '9:41');
div(face, { left: 300, top: 20 }, `<svg width="82" height="16" viewBox="0 0 82 16">
  <rect x="0" y="10" width="4" height="6" rx="1" fill="#fff"/><rect x="6" y="7" width="4" height="9" rx="1" fill="#fff"/>
  <rect x="12" y="4" width="4" height="12" rx="1" fill="#fff"/><rect x="18" y="1" width="4" height="15" rx="1" fill="#fff"/>
  <rect x="44" y="2" width="30" height="13" rx="4" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
  <rect x="46.5" y="4.5" width="22" height="8" rx="2" fill="#fff"/><rect x="75.5" y="6" width="2.5" height="5" rx="1" fill="#fff" fill-opacity=".6"/></svg>`);
div(face, { left: 28, top: 70, color: '#fff', fontSize: 27, fontWeight: 800, letterSpacing: '-0.01em' }, 'ShopGuide');
const kiPill = div(face, { left: 302, top: 74, width: 84, height: 34, borderRadius: 17, background: 'rgba(255,255,255,.16)',
  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', color: '#fff', fontSize: 16, fontWeight: 800 },
  'KI<svg width="15" height="13" viewBox="0 0 15 13"><path d="M1.5 7 L5.5 10.8 L13.5 2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');

// own stacking contexts, so card z-order never covers the content above them
const shLayer = div(face, { left: 0, top: 0, zIndex: 0 });
const bdLayer = div(face, { left: 0, top: 0, zIndex: 0 });
function cardPair(bg) {
  return { sh: div(shLayer, { boxShadow: '0 8px 22px rgba(44,62,80,.10), 0 1px 3px rgba(44,62,80,.06)' }),
           bd: div(bdLayer, { background: bg || '#fff', overflow: 'hidden' }) };
}
const header = cardPair(C.field);
const hdNote = div(header.bd, { left: 22, top: 19, fontSize: 15, fontWeight: 800, letterSpacing: '2px', color: C.navy }, 'EINKAUFSZETTEL');
const hdRoute = div(header.bd, { left: 22, top: 15, fontSize: 23, fontWeight: 700, color: C.navy }, 'Deine Route');
const chip = div(header.bd, { left: 268, top: 15, width: 82, height: 34, borderRadius: 17, background: '#fff',
  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', fontSize: 16, fontWeight: 700, color: C.navy },
  '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="#2c3e50" stroke-width="1.8"/><path d="M8 4.5 V8 L10.4 9.6" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/></svg>3 Min');

const rows = [
  { name: 'Milch',   sw: 124, aisle: 'F · R01', cold: true, ni: 0, ri: 2, seed: 7 },
  { name: 'Äpfel',   sw: 112, aisle: 'A · R10', ni: 1, ri: 0, seed: 3 },
  { name: 'Shampoo', sw: 188, aisle: 'E · R02', ni: 2, ri: 1, seed: 12 },
];
const LINE_Y = [272, 342, 412];
// note body slices, each holding its own handwritten line (texts live inside their cards)
const SLICE = [[210, 97], [307, 70], [377, 245]];
rows.forEach(r => { r.card = cardPair(); });

// handwriting (scribbles) + recognised text
const scrSvg = svg(face, 'svg', { width: 412, height: 886, style: 'position:absolute;left:0;top:0;overflow:visible' });
const scrClip = svg(svg(scrSvg, 'defs', {}), 'clipPath', { id: 'scrClip' });
const scrClipRect = svg(scrClip, 'rect', { x: 0, y: 0, width: 412, height: 886 });
const scrG = svg(scrSvg, 'g', { 'clip-path': 'url(#scrClip)' });
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function scribble(x0, base, width, seed) {
  const R = rng(seed), n = Math.max(3, Math.round(width / 21)), adv = width / n, pts = [[x0 - 8, base + 3]];
  for (let i = 0; i < n; i++) {
    const tall = i === 0 || R() < 0.24, h = tall ? 33 + R() * 8 : 13 + R() * 7;
    const a = adv / (2 * Math.PI), b = a * (tall ? 1.9 : 1.3 + R() * 0.45);
    for (let k = 1; k <= 20; k++) {
      const th = k / 20 * 2 * Math.PI;
      let y = base - h * (1 - Math.cos(th)) / 2;
      const x = x0 + i * adv + a * th - b * Math.sin(th) + (base - y) * 0.3;
      pts.push([x, y]);
    }
  }
  pts.push([x0 + width + 10, base - 5]);
  return 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
}
rows.forEach(r => {
  svg(scrG, 'path', { d: scribble(52, LINE_Y[r.ni] + 9, r.sw, r.seed), fill: 'none', stroke: C.navy, 'stroke-width': 3.2,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
});
rows.forEach(r => {
  r.text = div(r.card.bd, { left: 0, top: 0, fontSize: 25, fontWeight: 600, color: C.navy, lineHeight: '34px', height: 34, whiteSpace: 'nowrap' }, r.name);
  r.pill = div(face, { left: 0, top: 0, height: 34, borderRadius: 17, background: C.navy, color: '#fff', fontSize: 16,
    fontWeight: 700, padding: '0 14px', lineHeight: '34px', whiteSpace: 'nowrap' }, r.aisle);
  if (r.ri > 0) r.num = div(face, { left: 0, top: 0, width: 36, height: 36, borderRadius: '50%', background: C.navy, color: '#fff',
    fontSize: 17, fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center' }, String(r.ri + 1));
  if (r.cold) r.snow = div(face, { left: 0, top: 0, width: 24, height: 24 },
    `<svg width="24" height="24" viewBox="-12 -12 24 24" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round">
     ${[0, 60, 120].map(a => `<g transform="rotate(${a})"><path d="M0 -10 V10"/><path d="M-3 -7 L0 -4 L3 -7"/><path d="M-3 7 L0 4 L3 7"/></g>`).join('')}</svg>`);
});

// scanner
const scanBand = div(face, { left: 22, top: 0, width: 368, height: 64, background: 'rgba(44,62,80,.06)' });
const scanLine = div(face, { left: 22, top: 0, width: 368, height: 3, background: C.navy, borderRadius: 2 });

// scan button
const btn = div(face, { left: 72, top: 712, width: 268, height: 72, borderRadius: 36, background: C.navy,
  boxShadow: '0 10px 24px rgba(44,62,80,.22)' });
div(btn, { left: 21, top: 17, width: 38, height: 38, borderRadius: '50%', border: '2.5px solid rgba(255,255,255,.9)' });
const btnMask = div(btn, { left: 74, top: 0, width: 184, height: 72, overflow: 'hidden' });
const lbl1 = div(btnMask, { left: 0, top: 20, color: '#fff', fontSize: 22, fontWeight: 600, whiteSpace: 'nowrap' }, 'Zettel scannen');
const lbl2 = div(btnMask, { left: 0, top: 20, color: '#fff', fontSize: 22, fontWeight: 600, whiteSpace: 'nowrap' }, 'Scanne …');
div(face, { left: 146, top: 868, width: 120, height: 5, borderRadius: 3, background: 'rgba(44,62,80,.28)' });

// cursor
const cursor = div(worldA, { left: 0, top: 0, width: 44, height: 52, transformOrigin: '3px 3px' },
  `<svg width="44" height="52" viewBox="0 0 44 52"><path d="M3 3 L3 39 L12.5 30.5 L18.5 44 L25 41 L19 28 L31 28 Z"
   fill="#2c3e50" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>`);

/* ---------- world A timing functions ---------- */
const phoneDy = t => t < 1.62 ? 1180 : 1180 * (1 - spring(t - 1.62, 0.58));
const s1 = t => spring(t - 4.0, 0.5);   // note splits into cards
const s2 = t => spring(t - 4.5, 0.55);  // reorder: cold goods last
const s3 = t => spring(t - 4.56, 0.42); // text shifts for step numbers before the dot lands
function cardRect(r, t) {
  const A = { x: 22, y: SLICE[r.ni][0], w: 368, h: SLICE[r.ni][1] };
  const B = { x: 22, y: 236 + r.ni * 92, w: 368, h: 76 };
  const Cc = { x: 22, y: 236 + r.ri * 92, w: 368, h: 76 };
  const a = s1(t), b = s2(t);
  const o = {};
  for (const k in A) o[k] = A[k] + (B[k] - A[k]) * a + (Cc[k] - B[k]) * b;
  const r0 = r.ni === 2 ? [0, 0, 24, 24] : [0, 0, 0, 0];
  o.rad = r0.map(v => lerp(v, 18, a));
  return o;
}
function textPos(r, t) {
  const bC = 274 + r.ni * 92, cC = 274 + r.ri * 92;
  return { x: 50 + 44 * s3(t), y: LINE_Y[r.ni] + (bC - LINE_Y[r.ni]) * s1(t) + (cC - bC) * s2(t) };
}
const faceToWorld = (fx, fy, t) => [PX + FX + fx, PY + FY + fy + phoneDy(t)];
const scanY = t => clamp(272 + 280 * (t - 2.75), 210, 622);

/* =====================================================================
   WORLD B · store map → logo
   ===================================================================== */
const worldB = $('worldB'), layerB = $('layerB');
const BX = 820, BY = 150, BW = 980, BH = 735;
const bx = p => BX + p / 100 * BW, by = p => BY + p / 100 * BH;

const capB = [line(worldB, { x: 150, y: 350, size: 112 }, [{ t: 'Direkt' }])[0],
              line(worldB, { x: 150, y: 472, size: 112 }, [{ t: 'zum' }, { t: 'Regal.', cls: 'green' }])];
const capBWords = [capB[0], capB[1][0], capB[1][1]];

const board = div(worldB, { background: 'rgba(255,255,255,.86)', border: '1px solid rgba(255,255,255,.7)',
  boxShadow: '0 8px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.05), inset 0 1.5px 0 rgba(255,255,255,.65)' });

const SHELVES = [
  ['Obst & Gemüse', 5, 8, 40, 12], ['Fleisch & Fisch', 55, 8, 40, 12],
  ['Bio-Produkte', 5, 28, 40, 12], ['Getränke', 55, 28, 40, 12],
  ['Drogerie', 5, 48, 40, 12], ['Unverpackt', 55, 48, 40, 12],
  ['Kühlregal · Milch · Joghurt · Käse', 5, 68, 90, 12],
  ['Backwaren', 5, 88, 40, 10], ['Kasse', 55, 88, 40, 10],
];
const ARRIVE = { 0: 8.0, 4: 9.5, 6: 10.5, 8: 12.0 };   // shelf index → arrival time
const shelves = SHELVES.map(([name, l, tp, w, h], i) => {
  const el = div(worldB, { left: bx(l), top: by(tp), width: w / 100 * BW, height: h / 100 * BH, borderRadius: 14,
    background: C.field, border: '1px solid rgba(44,62,80,.07)', overflow: 'hidden' });
  const lab = div(el, { left: 0, top: 0, width: '100%', height: '100%', display: 'flex', alignItems: 'center',
    justifyContent: 'center', gap: '10px', fontSize: 21, fontWeight: 600, color: C.navy, whiteSpace: 'nowrap' }, name);
  const s = { el, lab, rect: { x: bx(l), y: by(tp), w: w / 100 * BW, h: h / 100 * BH }, i };
  if (name === 'Getränke') {
    s.badge = document.createElement('span');
    s.badge.style.cssText = 'display:inline-block;background:#2c3e50;color:#fff;font-size:15px;font-weight:700;padding:2px 10px;border-radius:12px;line-height:20px';
    s.badge.textContent = 'voll'; lab.appendChild(s.badge);
  }
  return s;
});
const shelfHL = (i, t) => ARRIVE[i] == null ? 0 : spring(t - ARRIVE[i] - 0.02, 0.4);

// status pill
const status = div(worldB, { left: BX, top: 905, width: 470, height: 60, borderRadius: 30, overflow: 'hidden',
  background: 'rgba(255,255,255,.86)', border: '1px solid rgba(255,255,255,.7)',
  boxShadow: '0 6px 22px rgba(0,0,0,.07), inset 0 1.5px 0 rgba(255,255,255,.65)' });
const STATUS = [
  [8.3, '<span class="grey">Navigiere zu:</span> Drogerie'],
  [8.62, 'Getränke voll <span class="grey">–</span> Umweg'],
  [9.5, '<span class="grey">Navigiere zu:</span> Kühlregal'],
  [10.5, '<span class="grey">Navigiere zu:</span> Kasse'],
  [12.05, 'Fertig!'],
].map(([t, html]) => ({ t, el: div(status, { left: 28, top: 13, fontSize: 22, fontWeight: 700, color: C.navy, whiteSpace: 'nowrap', lineHeight: '34px' }, html) }));

// logo geometry (favicon.png: 4×4 shelf grid + green route with two nodes)
const TS = 290, TCX = 960, TCY = 430;
const lg = (x, y) => [TCX - TS / 2 + x * TS / 780, TCY - TS / 2 + y * TS / 780];
const LU = TS / 780;
const cellRect = (r, c) => { const [x, y] = lg(42 + c * 184, 42 + r * 184); return { x, y, w: 145 * LU, h: 145 * LU }; };

// grid pieces: shelves split into halves/quarters that fold into the 4×4 grid
const pieces = [];
function addPieces(si, parts, row) {
  const s = shelves[si].rect, n = parts.length, w = s.w / n;
  parts.forEach((col, k) => {
    const rad = [k === 0 ? 14 : 0, k === n - 1 ? 14 : 0, k === n - 1 ? 14 : 0, k === 0 ? 14 : 0];
    pieces.push({ si, el: div(worldB, { display: 'none' }), from: { x: s.x + k * w, y: s.y, w, h: s.h }, rad, row, col });
  });

  nodeCore.setAttribute('cx', pA[0]); nodeCore.setAttribute('cy', pA[1]); nodeCore.setAttribute('r', (27 * LU * ng).toFixed(2));

  animWord(cta[1], t, 13.54, null, -1, ` translateX(${(12 * bump(t, 14.0, 14.36)).toFixed(2)}px)`);
  underline.style.transform = `scaleX(${spring(t - 14.02, 0.45).toFixed(4)})`;
}

function seek(t) {
  t = clamp(t, 0, 15);
  seekA(t); seekB(t); drawDot(t);
}

window.seek = seek;
window.__ready = false;
document.fonts.ready.then(() => {
  layerA.style.display = layerB.style.display = 'block';
  measure(); buildCams(); seek(0);
  window.__ready = true;
});

/* =====================================================================

window.renderAudio = async function () {
